<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Editor – Fast, Distraction-Free Text Editor in Your Browser</title>

        <!-- Primary SEO -->
        <meta
            name="description"
            content="A fast, distraction-free text editor in your browser. Keep multiple notes, open or drag & drop text files, use keyboard shortcuts, and work offline. Free, no sign-up, saved locally."
        />
        <meta
            name="keywords"
            content="online text editor, notepad online, browser notepad, markdown editor, plain text editor, offline notes, PWA text editor, distraction-free writing, code snippet editor"
        />
        <meta name="author" content="Saiful Alam Rakib" />
        <meta name="robots" content="index, follow, max-image-preview:large" />
        <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
        <link rel="canonical" href="https://text.msar.me/" />

        <!-- PWA Meta Tags -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Editor" />
        <meta name="application-name" content="Editor" />
        <meta name="msapplication-TileColor" content="#ffffff" />
        <meta name="msapplication-config" content="/browserconfig.xml" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Editor" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:url" content="https://text.msar.me/" />
        <meta property="og:title" content="Editor – Fast, Distraction-Free Text Editor in Your Browser" />
        <meta
            property="og:description"
            content="Keep notes, open or drag & drop text files, and write offline. Free, no sign-up, everything saved locally."
        />
        <meta property="og:image" content="https://text.msar.me/og-image.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Editor – a simple text editor shown in light and dark themes" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Editor – Fast, Distraction-Free Text Editor in Your Browser" />
        <meta
            name="twitter:description"
            content="Keep notes, open or drag & drop text files, and write offline. Free, no sign-up, everything saved locally."
        />
        <meta name="twitter:image" content="https://text.msar.me/og-image.png" />
        <meta name="twitter:image:alt" content="Editor – a simple text editor shown in light and dark themes" />

        <!-- Structured data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebApplication",
                "name": "Editor",
                "url": "https://text.msar.me/",
                "description": "A fast, distraction-free text editor in your browser with notes, file drag & drop, keyboard shortcuts and offline support.",
                "applicationCategory": "UtilitiesApplication",
                "operatingSystem": "Any",
                "browserRequirements": "Requires JavaScript",
                "image": "https://text.msar.me/og-image.png",
                "screenshot": ["https://text.msar.me/light.png", "https://text.msar.me/dark.png"],
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
                "author": { "@type": "Person", "name": "Saiful Alam Rakib", "url": "https://github.com/4msar" }
            }
        </script>

        <!-- PWA Icons -->
        <link rel="apple-touch-icon" href="/icon.svg" sizes="180x180" />
        <link rel="mask-icon" href="/icon.svg" color="#FFFFFF" />
        <link rel="shortcut icon" href="/icon.svg" />
        <meta name="msapplication-TileImage" content="/icon.svg" />
    </head>

    <body class="overflow-hidden font-mono bg-body bg-slate-100 dark:bg-slate-950 text-black dark:text-white">
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
